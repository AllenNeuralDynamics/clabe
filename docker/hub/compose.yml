# docker compose -f docker/hub/compose.yml up -d   (from the repository root)
services:
  hub:
    build:
      context: ../..
      dockerfile: docker/hub/Dockerfile
    image: clabe-hub
    ports: ["8080:8080"]
    env_file: .env               # copy .env.example: the hub's token, the rigs' token and the rigs
    volumes: ["hub-data:/data"]  # collected issue reports; `docker compose down -v` deletes them
    restart: unless-stopped

volumes:
  hub-data:
