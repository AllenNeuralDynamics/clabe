# docker compose -f docker/hub/compose.yml up -d   (from the repository root)
services:
  hub:
    build:
      context: ../..
      dockerfile: docker/hub/Dockerfile
    image: clabe-hub
    ports: ["8080:8080"]
    env_file: .env
    volumes: ["hub-data:/data"]  # hub.db (enrolled rigs, exclusions, reports) and the reports' zips
    restart: unless-stopped

volumes:
  hub-data:
    name: hub_hub-data  # fixed, so -p or another folder uses the same data; `down -v` deletes it
