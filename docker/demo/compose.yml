# The hub of scripts/demo.ps1. Its daemon enrolls as this-pc, reached at host.docker.internal.
#   docker compose -f docker/demo/compose.yml up -d --build
services:
  hub:
    build:
      context: ../..
      dockerfile: docker/hub/Dockerfile
    image: clabe-hub
    ports: ["${HUB_PORT:-24080}:8080"]
    environment:
      TOKEN: "${DEMO_TOKEN:?run scripts/demo.ps1: it sets a token}"
      RIG_TOKEN: "${DEMO_TOKEN}"
      ENROLL_TOKEN: "${DEMO_TOKEN}"
      POLL_INTERVAL: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["hub-data:/data"]

volumes:
  hub-data:
