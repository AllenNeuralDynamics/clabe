# The hub of scripts/demo.ps1, following the daemon on this computer (reached from the container as
# host.docker.internal).   docker compose -f docker/demo/compose.yml up -d --build
services:
  hub:
    build:
      context: ../..
      dockerfile: docker/hub/Dockerfile
    image: clabe-hub
    ports: ["${HUB_PORT:-8080}:8080"]
    environment:
      RIGS: "this-pc=http://host.docker.internal:${DAEMON_PORT:-24070}"
      POLL_INTERVAL: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
