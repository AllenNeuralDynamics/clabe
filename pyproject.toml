[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "aind-clabe"
description = "A library for a minimal framework that can be used to build experimental interfaces."
authors = [{ name = "Bruno Cruz", email = "bruno.cruz@alleninstitute.org" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
version = "0.18.0rc3"
readme = { file = "README.md", content-type = "text/markdown" }

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pydantic>=2.11",
    "pydantic-settings",
    "gitpython",
    "requests",
    "rich",
    "aind_behavior_services>=0.13.0",
    "opentelemetry-api>=1.24",
    "markdown-it-py>=2",
    "httpx>=0.27",
]

[project.urls]
Documentation = "https://allenneuraldynamics.github.io/clabe/"
Repository = "https://github.com/AllenNeuralDynamics/clabe/"
Issues = "https://github.com/AllenNeuralDynamics/clabe/issues"
Changelog = "https://github.com/AllenNeuralDynamics/clabe/releases"

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "pyyaml",
]
aind-services = [
    "requests",
    "pyyaml",
    "pykeepass",
    "msal; sys_platform == 'win32'",
    "aind-data-schema>=2",
    "aind-data-transfer-service >= 2.2.0",
    "aind-watchdog-service >= 0.1.10",
    "confierge>=0.1.4",
]
agents = [
    "mcp>=2.3",
]
frontend = [
    # the terminal UI, and the web server: a run's browser page, the daemon and the hub
    "textual>=8.2.7",
    "textual-fspicker>=1.0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]

dev = [
    "ruff",
    "codespell",
    "coverage",
    'pytest',
    'pytest-cov',
    'pytest-asyncio',
    'interrogate',
    "aind-clabe[aind-services]",
    "aind-clabe[otel]",
    "aind-clabe[agents]",
    "aind-clabe[frontend]",
]

docs = [
    "aind-clabe[aind-services]",
    "aind-clabe[frontend]",
    'zensical',
    'mkdocstrings[python]',
    'pymdown-extensions',
]

[project.scripts]
clabe = "clabe.cli:main"

[tool.uv]
default-groups = ['dev']

[tool.uv.build-backend]
module-name = "clabe"

[tool.uv.sources]
confierge = { git = "https://github.com/AllenNeuralDynamics/ficus.git", subdirectory = "packages/confierge", tag = "v0.3.0" }


[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["tests/assets/*"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I"]
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "google" }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,./src/clabe/server/static,./ui-web/bin,./ui-web/obj'
ignore-words-list = "nd, assertIn, te, fo"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --ignore=tests/assets"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["asyncio: mark test as requiring asyncio", "network: test that requires access to the live AIND network endpoints"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
ignore_nested_functions = true
ignore_overloaded_functions = true
ignore-private = true
fail-under = 100
exclude = [
    "__init__.py",
    "tests",
    "docs",
    "build",
    "setup.py",
    "examples",
    "site",
]
