# The documentation site of clabe (https://zensical.org).
#   uv run docs/build.py        # regenerate the API reference pages and its part of the nav below
#   uv run zensical serve       # preview at http://localhost:8000
#   uv run zensical build       # into site/ (CI: --strict)

[project]
site_name = "clabe"
site_description = "Behavior experiments as declared workflows: run, answer and follow them from anywhere."
site_author = "Bruno Cruz"
site_url = "https://allenneuraldynamics.github.io/clabe/"
repo_url = "https://github.com/AllenNeuralDynamics/clabe"
repo_name = "AllenNeuralDynamics/clabe"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Allen Institute for Neural Dynamics"
extra_css = ["stylesheets/allen.css"]
watch = ["src/clabe", "README.md", "examples"]

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "First experiment" = "articles/first_experiment.md" },
    { "Write a workflow" = "articles/workflows.md" },
    { "Reusable steps and checks" = "articles/reusable_steps.md" },
    { "Run on two PCs" = "articles/remote_execution.md" },
    { "Deploy a rig" = "articles/deployment.md" },
    { "Migrate an experiment" = "articles/migrating.md" },
  ] },
  { "Guides" = [
    { "Frontends" = "articles/frontends.md" },
    { "Run records" = "articles/records.md" },
    { "Configuration" = "articles/configuration.md" },
    { "Stores" = "articles/stores.md" },
    { "Store backends" = "articles/store_backends.md" },
    { "Runnables" = "articles/runnables.md" },
    { "Logging" = "articles/logging.md" },
    { "Data transfer" = "articles/data_transfer.md" },
    { "Daemon" = "articles/daemon.md" },
    { "Hub" = "articles/hub.md" },
    { "Agents" = "articles/agents.md" },
    { "Service settings" = "articles/service_settings.md" },
  ] },
  { "Examples" = [
    { "AIND experiment" = "docs_examples/behavior_launcher.md" },
    { "Remote execution" = "docs_examples/remote_execution.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "Glossary" = "concepts/glossary.md" },
  ] },
  # --- API reference: generated by docs/build.py, do not edit by hand ---
  { "API Reference" = [
    { "Workflows" = [
      { "clabe.workflow" = "api/workflow.md" },
      { "clabe.steps" = "api/steps.md" },
      { "clabe.checks" = "api/checks.md" },
      { "clabe.workflow.events" = "api/workflow/events.md" },
