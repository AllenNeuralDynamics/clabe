    ] },
    { "Launching and apps" = [
      { "clabe.launcher" = "api/launcher.md" },
      { "clabe.apps" = "api/apps.md" },
      { "clabe.apps.open_ephys" = "api/apps/open_ephys.md" },
      { "clabe.runnable" = "api/runnable.md" },
      { "clabe.session" = "api/session.md" },
    ] },
    { "Rigs and fleets" = [
      { "clabe.remote" = "api/remote.md" },
      { "clabe.daemon" = "api/daemon.md" },
      { "clabe.hub" = "api/hub.md" },
      { "clabe.agents" = "api/agents.md" },
      { "clabe.server" = "api/server.md" },
      { "clabe.reports" = "api/reports.md" },
    ] },
    { "Configuration and stores" = [
      { "clabe.settings" = "api/settings.md" },
      { "clabe.stores" = "api/stores.md" },
      { "clabe.cache" = "api/cache.md" },
