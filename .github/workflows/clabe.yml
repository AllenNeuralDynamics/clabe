name: clabe test suite

on:
  pull_request:
  push:
    branches:
      - main
      - dev*
      - release*
  release:
    types: [ published ]

jobs:
  # ╔──────────────────────────╗
  # │   _____         _        │
  # │  |_   _|__  ___| |_ ___  │
  # │    | |/ _ \/ __| __/ __| │
  # │    | |  __/\__ \ |_\__ \ │
  # │    |_|\___||___/\__|___/ │
  # │                          │
  # ╚──────────────────────────╝
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ 3.11, 3.12, 3.13 ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Run ruff format
        run: uv run ruff format

      - name: Run ruff check
        run: uv run ruff check

      - name: Run interrogate
        run: uv run interrogate

      - name: Run codespell
        run: uv run codespell --check-filenames

      - name: Run pytest
        run: uv run pytest --cov clabe -m "not network"

      - name: Check example workflows
        run: uv run clabe check examples --strict

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the web UI
        run: uv run python scripts/build_web.py

      - name: Build
        run: uv build

  web-ui:
    name: Web UI in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the web UI
        run: |
          uv sync
          uv run python scripts/build_web.py

      - name: Install Chromium
        run: |
          uv run --with playwright playwright install --only-shell chromium
          uv run --with playwright python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()"

      - name: Run the browser tests
        run: uv run --with playwright pytest tests/server tests/daemon tests/hub -p no:cacheprovider

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build the docs, failing on any warning
        run: |
          uv sync --group docs
          uv run docs/build.py
          uv run zensical build --strict --clean

  # A wheel of every commit pushed to main (web UI included), in one pre-release, `builds`: rigs and experiments use a
  # commit without a release (`clabe daemon deploy --commit <sha>`, or the wheel's URL in an experiment's pyproject).
  # Its version is the release it follows plus the commit (`0.18.0+g<sha>`). The newest 100 are kept.
  builds:
    name: Build of main
    runs-on: ubuntu-latest
    needs: [ tests, web-ui ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: builds
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version it with the commit
        run: uv version "$(uv version --short)+g${GITHUB_SHA}"

      - name: Build the web UI and the wheel
        run: |
          uv run python scripts/build_web.py
          uv build --wheel

      - name: Add it to the builds release
        run: |
          if ! gh release view builds > /dev/null 2>&1; then
            gh release create builds --prerelease --latest=false --target "$GITHUB_SHA" --title "Builds of main" \
              --notes "A wheel of every commit pushed to main (the newest 100): clabe daemon deploy --commit <sha>"
          fi
          gh release upload builds dist/*.whl --clobber
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/builds" --jq .id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +101 | cut -f2 \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/{}"

  # Builds the hub image once and smoke-tests it; that same image is pushed to ghcr.io/allenneuraldynamics/clabe-hub
  # as `main` and `sha-<commit>` on a push to main, and as the release's tag (plus `latest`, unless it is a pre-release)
  # on a published release. On a release it waits for prepare-release, which moves the tag to the commit that sets the
  # version, so the image carries the release's version.
  hub-image:
    name: Hub Docker image
    runs-on: ubuntu-latest
    needs: [ tests, prepare-release ]
    if: >-
      always() && needs.tests.result == 'success' && github.event.release.tag_name != 'builds'
      && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/allenneuraldynamics/clabe-hub
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/hub/Dockerfile
          load: true
          tags: |
            clabe-hub
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test it
        run: |
          docker run -d --name hub -p 8080:8080 -e TOKEN=ci clabe-hub
          for i in $(seq 1 30); do curl -sf localhost:8080/openapi.json > /dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/hub/rigs)" = 401
          curl -sf -H 'Authorization: Bearer ci' localhost:8080/api/hub/rigs
          curl -sf localhost:8080/ | grep -q '<title>clabe</title>'

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: env.PUBLISH == 'true'
        run: docker push --all-tags ghcr.io/allenneuraldynamics/clabe-hub

  # ╔───────────────────────────────────────────────────────────╗
  # │    ____ ___ ____ ____    ____      _                      │
  # │   / ___|_ _/ ___|  _ \  |  _ \ ___| | ___  __ _ ___  ___  │
  # │  | |    | | |   | | | | | |_) / _ \ |/ _ \/ _` / __|/ _ \ │
  # │  | |___ | | |___| |_| | |  _ <  __/ |  __/ (_| \__ \  __/ │
  # │   \____|___\____|____/  |_| \_\___|_|\___|\__,_|___/\___| │
  # │                                                           │
  # ╚───────────────────────────────────────────────────────────╝
  # ╔─────────────────────────────────────────────────────────────────╗
  # │   ____        _     _ _        ____      _                      │
  # │  |  _ \ _   _| |__ | (_) ___  |  _ \ ___| | ___  __ _ ___  ___  │
  # │  | |_) | | | | '_ \| | |/ __| | |_) / _ \ |/ _ \/ _` / __|/ _ \ │
  # │  |  __/| |_| | |_) | | | (__  |  _ <  __/ |  __/ (_| \__ \  __/ │
  # │  |_|    \__,_|_.__/|_|_|\___| |_| \_\___|_|\___|\__,_|___/\___| │
  # │                                                                 │
  # ╚─────────────────────────────────────────────────────────────────╝

  prepare-release:
    runs-on: ubuntu-latest
    name: Set version from release tag
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name != 'builds'
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          version=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Setting version to: $version"

      - name: Validate version format
        run: uv version ${{ steps.get_version.outputs.version }} --dry-run

      - name: Set version
        run: uv version ${{ steps.get_version.outputs.version }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the web UI
        run: uv run python scripts/build_web.py

      - name: Build
        run: uv build

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Commit version changes
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Set version ${{ steps.get_version.outputs.version }} [skip ci]"
          git push origin main
          # Move the release tag to point to this new commit.
          git tag -fa "${{ github.event.release.tag_name }}" -m "${{ github.event.release.tag_name }}"
          git push origin "${{ github.event.release.tag_name }}" --force

  publish-to-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: prepare-release
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.AIND_PYPI_TOKEN }}

      - name: Upload wheels to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
