name: Documentation

# Builds the site with Zensical and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions):
# when a release is published, or when run by hand (Actions > Documentation > Run workflow).
# Pull requests and pushes only check that the site builds (the "Docs build (strict)" job of clabe.yml).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build the site
        run: |
          uv sync --group docs
          uv run docs/build.py
          uv run zensical build --clean --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
